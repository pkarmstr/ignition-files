version = 1

; Paths are inside the container: /models is /var/mnt/storage/llama-models on
; the host, i.e. the same layout as the model tree on erevrav. These two must
; stay in sync with the FILES list in fetch-models.sh.
;
; Only the model this box actually has is listed: the 24 GB Qwen3.8-27B Q6_K_XL
; fetch in fetch-models.sh. The settings are the strix box's Qwen3.8-27B Q4
; preset (its smaller 27B config); the other presets (Flash-Next, BF16, 35B
; MoE, DeepSeek) are dropped until their files are rsynced over.
;
; ctx-size and spec-draft-n-max are capped for the Strix Halo iGPU: at long
; context a single Vulkan compute submit (flash-attn + up to n draft graphs)
; outlives amdgpu's 2 s lockup watchdog, the kernel resets the compute ring,
; and llama-server dies with vk::Queue::submit: ErrorDeviceLost (upstream
; llama.cpp #20515 / #21724). Keeping the per-submit work small and
; amdgpu.lockup_timeout=100000 in the kernel cmdline (config.bu) are the
; mitigations.

[Qwen3.8-27B-Q6-MTP-24GB]
model = /models/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q6_K_XL.gguf
load-mode = none
temperature = 0.7
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
parallel = 1
ctx-size = 131072
flash-attn = on
jinja = true
reasoning = on
reasoning-preserve = true
chat-template-file = /models/Qwen-Fixed-Chat-Templates/chat_template.jinja
reasoning-format = deepseek
chat-template-kwargs = {"reasoning_effort":"medium"}
spec-type = draft-mtp
spec-draft-n-max = 4
